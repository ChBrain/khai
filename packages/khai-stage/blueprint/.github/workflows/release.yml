name: release

# Changesets-driven release for a khai plays house.
#
# On every push to main:
#   * If unreleased changeset files exist, the action opens/updates a
#     "Version Packages" PR that bumps the version and writes the CHANGELOG.
#     Merging that PR consumes the changesets.
#   * If there are no pending changesets (the version PR was just merged),
#     the action runs `changeset publish`, which publishes the house package
#     to GitHub Packages and pushes its git tag.
#
# ── Token requirements ───────────────────────────────────────────────────────
# RELEASE_TOKEN must be a PAT with:
#   * Contents: Read and write   (push the changeset-release/main branch + tags)
#   * Pull requests: Read and write   (open the Version PR)
# The built-in GITHUB_TOKEN cannot drive the git pushes here: GitHub suppresses
# workflow runs on commits made by GITHUB_TOKEN (anti-recursion), so the Version
# PR would never get CI and could never be merged green.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://npm.pkg.github.com"
          scope: "@chbrain"
          cache: "npm"

      - name: install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: test
        run: npm test

      - name: changesets release
        uses: changesets/action@v2
        with:
          # v2 renamed both script inputs. Under the old names the action fails
          # outright rather than falling back, so the rename is not optional.
          version-script: npm run version
          publish-script: npm run release
          # v2 also has a `github-token` input defaulting to the built-in token,
          # and refuses to run when a GITHUB_TOKEN env var disagrees with it,
          # which is exactly what passing the PAT through env used to do. The PAT
          # goes in the input; it cannot be dropped for the default, because of
          # the anti-recursion note above: GITHUB_TOKEN suppresses workflow runs
          # on the commits it makes, so the Version PR would never get CI.
          github-token: ${{ secrets.RELEASE_TOKEN }}
        env:
          # Only the registry token stays in env: npm reads it during
          # `changeset publish`, the action never does.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
